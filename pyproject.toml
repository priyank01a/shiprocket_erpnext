[project]
name = "shiprocket_erpnext"
authors = [
    { name = "Codex" }
]
description = "ERPNext Delivery Note to Shiprocket integration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests>=2.25.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0"
erpnext = ">=14.0.0"
